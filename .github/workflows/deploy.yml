name: Deploy Production
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start Service
        run: npm start
        env:
          NODE_ENV: production
          PORT: 3000
